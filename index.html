  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="UniSync" />

  <link rel="icon" type="image/x-icon" href="./favicon.ico" />

  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <style>
    :root {
      --bg: #EAF1FA;
      --surface: #F3F6FC;
      --surface-alt: #DCE9F8;
      --primary: #2456A6;
      --primary-deep: #142D59;
      --accent: #3986D9;
      --soft: #83B8EB;
      --border: #C5D5EA;
      --text: #142D59;
      --text-sec: #526783;
      --on-primary: #F8FAFE;
      --danger: #B3261E;
      --cat-general: #4E6A85;
      --cat-math: #6A4CAF;
      --cat-core: #2456A6;
      --cat-grad: #0E3A5D;
      --font-scale: 1;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(20, 45, 89, 0.08);
    }
    body.dark {
      --bg: #0B1730;
      --surface: #142D59;
      --surface-alt: #1B386B;
      --primary: #3986D9;
      --primary-deep: #0B1730;
      --accent: #83B8EB;
      --soft: #3986D9;
      --border: #284D8C;
      --text: #EAF1FA;
      --text-sec: #ACC6E8;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    body.role-instructor {
      --bg: #EAE6F5;
      --surface: #F3F0FA;
      --surface-alt: #DED7F1;
      --primary: #44317E;
      --primary-deep: #21183F;
      --accent: #7056B3;
      --soft: #A18BD5;
      --border: #CFC5E5;
      --text: #21183F;
      --text-sec: #655B7C;
      --shadow: 0 2px 10px rgba(33, 24, 63, 0.09);
    }
    body.role-instructor.dark {
      --bg: #151126;
      --surface: #21183F;
      --surface-alt: #2C2154;
      --primary: #A18BD5;
      --primary-deep: #151126;
      --accent: #A18BD5;
      --soft: #7056B3;
      --border: #433378;
      --text: #F3F0FA;
      --text-sec: #C8BBE8;
      --on-primary: #151126;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", Arial, sans-serif;
      font-size: calc(14px * var(--font-scale));
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    .hidden { display: none !important; }
    .container { max-width: 1080px; margin: 0 auto; padding: 14px 16px 84px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.92rem;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-outline { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-soft { background: var(--surface-alt); color: var(--text); border-color: var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { min-height: 34px; padding: 5px 10px; font-size: 0.82rem; border-radius: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    .input, .select, .textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .muted { color: var(--text-sec); font-size: 0.86rem; }

    /* Entry / Auth Screen */
    .auth-wrap {
      min-height: 100vh;
      padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, var(--bg) 0%, var(--surface-alt) 50%, var(--bg) 100%);
    }
    .auth-topbar {
      width: 100%;
      max-width: 540px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }
    .brand-logo {
      width: 68px;
      height: 68px;
      border-radius: 19px;
      box-shadow: var(--shadow);
      object-fit: cover;
    }
    .auth-card {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      border-radius: 20px;
    }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 18px; }
    .role-tile {
      padding: 13px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      text-align: start;
    }
    .role-tile.active {
      border-color: var(--primary);
      background: var(--surface-alt);
      box-shadow: 0 0 0 1px var(--primary);
    }

    /* Workspace Shell */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .avatar-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface-alt);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
    }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 6px 4px max(8px, env(safe-area-inset-bottom));
    }
    .nav-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-sec);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    .nav-tab.active { color: var(--primary); }

    /* Side Drawer (Navigation + Account & Settings) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(10, 18, 36, 0.45);
      display: flex;
    }
    .drawer-panel {
      width: min(336px, 88vw);
      height: 100%;
      background: var(--surface);
      border-inline-end: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0,0,0,0.28);
    }
    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .drawer-nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      border: none;
      background: transparent;
      text-align: start;
      cursor: pointer;
      font-weight: 600;
    }
    .drawer-nav-item.active {
      background: var(--surface-alt);
      color: var(--primary);
    }

    /* Visual Roadmap Canvas (strictly LTR math inside even when Arabic RTL) */
    .roadmap-viewport {
      position: relative;
      width: 100%;
      height: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      touch-action: none;
      direction: ltr;
      user-select: none;
    }
    .roadmap-board {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    .roadmap-node {
      position: absolute;
      width: 184px;
      height: 104px;
      border-radius: 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      text-align: left;
    }
    .roadmap-node-head {
      padding: 4px 8px;
      color: #F8FAFE;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .roadmap-node-body {
      padding: 6px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .roadmap-node-title {
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .roadmap-stage-pill {
      position: absolute;
      width: 184px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      border: 1px solid var(--border);
    }

    /* Priority Badges (Strictly Blue / Royal Purple / Crimson / Slate) */
    .prio-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #F8FAFE;
    }
    .prio-CRITICAL { background: #9E2A3B; }
    .prio-HIGH { background: #44317E; }
    .prio-NORMAL { background: #2456A6; }
    .prio-LOW { background: #526783; }

    /* Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(10, 18, 36, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      width: 100%;
      max-width: 500px;
      max-height: 86vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.32);
    }

    /* Pomodoro Companion Bounce */
    @keyframes floatBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .companion-bob { animation: floatBob 2.6s ease-in-out infinite; }
  </style>
</head>

    function playRingtone(id) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const opt = RINGTONES.find((r) => r.id === id) || RINGTONES[0];
        opt.freqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + idx * 0.16 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.16 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.16);
          osc.stop(ctx.currentTime + idx * 0.16 + 0.38);
        });
      } catch (_) {}
    }

    function sanitizeState(rawObj) {
      const base = cloneObj(DEFAULT_STATE);
      if (!rawObj || typeof rawObj !== 'object') return base;
      const merged = Object.assign(base, rawObj);
      const validStudentTabs = ['home', 'inbox', 'pomodoro', 'calendar', 'chat', 'hub', 'roadmaps', 'gpa', 'portals', 'support'];
      const validInstructorTabs = ['smart_inbox', 'calendar', 'materials', 'chat_email', 'portals', 'support'];

      merged.role = merged.role === 'INSTRUCTOR' ? 'INSTRUCTOR' : 'STUDENT';
      if (!LANGUAGES.some((l) => l.code === merged.language)) merged.language = 'en';
      if (!AOU_BRANCHES.some((b) => b.name === merged.branch)) merged.branch = 'Riyadh';
      if (!MAJORS.some((m) => m.id === merged.majorId)) merged.majorId = 'cs';
      if (!validStudentTabs.includes(merged.studentTab)) merged.studentTab = 'home';
      if (!validInstructorTabs.includes(merged.instructorTab)) merged.instructorTab = 'smart_inbox';

      ['books', 'bookMessages', 'materials', 'emails', 'clusters', 'forumPosts', 'chats', 'voiceNotes', 'events', 'gpaCourses'].forEach((k) => {
        if (!Array.isArray(merged[k])) merged[k] = cloneObj(DEFAULT_STATE[k]);
      });
      if (!merged.courseStatuses || typeof merged.courseStatuses !== 'object' || Array.isArray(merged.courseStatuses)) {
        merged.courseStatuses = {};
      }
      if (!merged.studyAids || typeof merged.studyAids !== 'object') {
        merged.studyAids = { flashcards: [], mindMap: [] };
      } else {
        if (!Array.isArray(merged.studyAids.flashcards)) merged.studyAids.flashcards = [];
        if (!Array.isArray(merged.studyAids.mindMap)) merged.studyAids.mindMap = [];
      }
      merged.roadmapZoom = Number.isFinite(Number(merged.roadmapZoom)) ? Math.max(0, Math.min(200, Number(merged.roadmapZoom))) : (window.innerWidth < 600 ? 70 : 100);
      merged.roadmapPanX = Number.isFinite(Number(merged.roadmapPanX)) ? Number(merged.roadmapPanX) : 0;
      merged.roadmapPanY = Number.isFinite(Number(merged.roadmapPanY)) ? Number(merged.roadmapPanY) : 0;
      merged.fontScale = Number.isFinite(Number(merged.fontScale)) ? Number(merged.fontScale) : 1;
      merged.pomodoroMinutes = Number.isFinite(Number(merged.pomodoroMinutes)) && Number(merged.pomodoroMinutes) > 0 ? Number(merged.pomodoroMinutes) : 25;
      merged.pomodoroSecondsLeft = Number.isFinite(Number(merged.pomodoroSecondsLeft)) && Number(merged.pomodoroSecondsLeft) >= 0 ? Number(merged.pomodoroSecondsLeft) : merged.pomodoroMinutes * 60;
      merged.focusMinutesLogged = Number.isFinite(Number(merged.focusMinutesLogged)) ? Number(merged.focusMinutesLogged) : 30;
      merged.pomodoroRunning = false;
      merged.isRecordingVoice = false;
      merged.focusLockBanner = false;
      merged.drawerOpen = false;
      merged.activeAlarm = null;
      return merged;
    }

        if (!raw) return cloneObj(DEFAULT_STATE);
        return sanitizeState(JSON.parse(raw));
      } catch (_) {
        return cloneObj(DEFAULT_STATE);

    function formatCountdown(ts) {
      const diff = Math.max(0, ts - Date.now());
      const sec = Math.floor(diff / 1000);
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return d > 0 ? `${d}d ${h}h ${m}m ${s}s` : `${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
    }

    // Book-Only Study Assistant (Strictly from state.books)
    function answerFromBooksOnly(query) {
      const q = query.trim().toLowerCase();
      if (!q) return '';
      const words = q.split(/\s+/).filter((w) => w.length > 2);
      const scored = state.books.map((b) => {
        const hay = (b.title + ' ' + b.content).toLowerCase();
        const hits = words.reduce((acc, w) => acc + (hay.includes(w) ? 1 : 0), 0);
        return { book: b, hits };
      }).filter((x) => x.hits > 0).sort((a, b) => b.hits - a.hits);

      if (!scored.length) {
        return state.language === 'ar'
          ? 'لم يتم العثور على هذا المفهوم في كتبك وملاحظاتك المرفوعة. أضف نص المادة أولاً لأن المساعد يجيب من كتبك فقط.'
          : 'Not found in your uploaded UniSync books & notes. This assistant strictly answers from your in-app books only.';
      }
      const top = scored[0].book;
      return `📖 [${top.title}]: ${top.content}`;
    }

        { id: 'roadmaps', icon: '🗺️', label: S.roadmaps }

        { id: 'smart_inbox', icon: '📧', label: S.smartInbox },
        { id: 'calendar', icon: '📅', label: S.calendar },
        { id: 'materials', icon: '☁️', label: S.materials },
        { id: 'chat_email', icon: '💬', label: S.chatEmail }
      ];
      const bottomTabs = state.role === 'STUDENT' ? studentTabs : instructorTabs;
      const activeTab = state.role === 'STUDENT' ? state.studentTab : state.instructorTab;

      const avatarMarkup = state.avatarDataUrl
        ? `<img src="${state.avatarDataUrl}" alt="${esc(S.profilePhoto)}" />`
        : `<span style="font-size:1.15rem;">👤</span>`;

      let mainHtml = '';
      if (state.role === 'STUDENT') {
        if (activeTab === 'home') mainHtml = renderStudentHome(S);
        else if (activeTab === 'inbox') mainHtml = renderStudentInbox(S);
        else if (activeTab === 'pomodoro') mainHtml = renderPomodoro(S);
        else if (activeTab === 'calendar') mainHtml = renderCalendarScreen(S);
        else if (activeTab === 'chat') mainHtml = renderChatScreen(S);
        else if (activeTab === 'hub') mainHtml = renderStudyHub(S);
        else if (activeTab === 'roadmaps') mainHtml = renderRoadmapScreen(S);
        else if (activeTab === 'gpa') mainHtml = renderGpaScreen(S);
        else if (activeTab === 'portals') mainHtml = renderPortalsScreen(S);
        else if (activeTab === 'support') mainHtml = renderSupportScreen(S);
      } else {
        if (activeTab === 'smart_inbox') mainHtml = renderInstructorDashboard(S);
        else if (activeTab === 'calendar') mainHtml = renderCalendarScreen(S);
        else if (activeTab === 'materials') mainHtml = renderInstructorMaterials(S);
        else if (activeTab === 'chat_email') mainHtml = renderChatScreen(S);
        else if (activeTab === 'portals') mainHtml = renderPortalsScreen(S);
        else if (activeTab === 'support') mainHtml = renderSupportScreen(S);

              <div style="font-weight:800;line-height:1.1;">UniSync</div>

        <nav class="bottom-nav">
          ${bottomTabs.map((tab) => `
            <button type="button" class="nav-tab ${activeTab === tab.id ? 'active' : ''}" data-nav="${tab.id}">
              <span style="font-size:1.1rem;">${tab.icon}</span>
              <span>${esc(tab.label)}</span>
            </button>
          `).join('')}

        ${state.drawerOpen ? renderSideDrawer(S, avatarMarkup) : ''}

        ${state.showDownloadsModal ? renderDownloadsModal(S) : ''}

      `;

    function renderSideDrawer(S, avatarMarkup) {
      const studentDrawerItems = [
        { id: 'home', icon: '🏠', label: S.home },

        { id: 'calendar', icon: '📅', label: S.calendar },
        { id: 'chat', icon: '💬', label: S.chat },
        { id: 'hub', icon: '📚', label: S.studyHub },
        { id: 'roadmaps', icon: '🗺️', label: S.roadmaps },
        { id: 'gpa', icon: '🧮', label: S.gpaCalc },
        { id: 'portals', icon: '🌐', label: S.portals },
        { id: 'support', icon: '🎧', label: S.support }
      ];
      const instructorDrawerItems = [
        { id: 'smart_inbox', icon: '📧', label: S.smartInbox },
        { id: 'calendar', icon: '📅', label: S.calendar },

        { id: 'chat_email', icon: '💬', label: S.chatEmail },
        { id: 'portals', icon: '🌐', label: S.portals },

                <div class="row">
                  <img src="./icon.svg" alt="UniSync" style="width:38px;height:38px;border-radius:11px;" />
                  <div>
                    <div style="font-weight:800;">UniSync</div>
                    <div class="muted" style="font-size:0.75rem;">${esc(S.aouPrefix)} · ${esc(state.branch)}</div>
                  </div>
                </div>
                <button id="closeDrawerBtn" type="button" class="btn btn-outline btn-sm">✕</button>

              <div class="row" style="margin-top:12px;">

                    <span>${it.icon}</span><span>${esc(it.label)}</span>
                  </button>
                `).join('')}
                <hr style="border:none;border-top:1px solid var(--border);margin:6px 0;" />

                  <span>⚙️</span><span>${esc(S.accountSettings)}</span>
                </button>
              ` : `
                <div class="row" style="align-items:center;">
                  <label for="avatarUploadInput" class="avatar-btn" style="width:52px;height:52px;position:relative;" title="${esc(S.profilePhoto)}">

                  <input id="avatarUploadInput" type="file" accept="image/*" class="hidden" />
                  <div style="flex:1;">
                    <div style="font-weight:700;">${esc(S.profilePhoto)}</div>
                    <div class="muted" style="font-size:0.78rem;">${esc(S.tapPhoto)}</div>
                  </div>
                </div>

                <div class="card" style="background:var(--surface-alt);padding:10px;font-size:0.78rem;">
                  🔒 ${esc(S.dataProtection)}
                </div>

                <div style="font-weight:700;font-size:0.84rem;">${esc(S.chooseRole)}</div>
                <div class="row">
                  <button type="button" class="pill ${state.role === 'STUDENT' ? 'active' : ''}" data-drawer-role="STUDENT">🎓 ${esc(S.studentRole)}</button>
                  <button type="button" class="pill ${state.role === 'INSTRUCTOR' ? 'active' : ''}" data-drawer-role="INSTRUCTOR">💻 ${esc(S.instructorRole)}</button>
                </div>

                <label style="font-weight:700;font-size:0.84rem;">${esc(S.branch)}</label>
                <select id="drawerBranchSelect" class="select">
                  ${AOU_BRANCHES.map((b) => `<option value="${b.name}" ${state.branch === b.name ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
                </select>

                ${state.role === 'STUDENT' ? `
                  <label style="font-weight:700;font-size:0.84rem;">${esc(S.major)}</label>
                  <select id="drawerMajorSelect" class="select">
                    ${MAJORS.map((m) => `<option value="${m.id}" ${state.majorId === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
                  </select>
                ` : ''}

                <label style="font-weight:700;font-size:0.84rem;">${esc(S.language)}</label>
                <select id="drawerLangSelect" class="select">
                  ${LANGUAGES.map((l) => `<option value="${l.code}" ${state.language === l.code ? 'selected' : ''}>${esc(l.native)} (${esc(l.en)})</option>`).join('')}
                </select>

                <div style="font-weight:700;font-size:0.84rem;">${esc(S.fontSize)}</div>
                <div class="row">
                  <button type="button" class="pill ${state.fontScale === 1 ? 'active' : ''}" data-font-scale="1">${esc(S.fontCompact)}</button>
                  <button type="button" class="pill ${state.fontScale === 1.12 ? 'active' : ''}" data-font-scale="1.12">${esc(S.fontLarge)}</button>

                <button id="drawerSignOutBtn" type="button" class="btn btn-danger" style="width:100%;">${esc(S.signOut)}</button>
              `}

          </aside>
        </div>
      `;

    function renderStudentHome(S) {

            ${nextEv ? `
              <div style="font-size:1.1rem;font-weight:800;margin-top:6px;">${esc(nextEv.code)} · ${esc(nextEv.title)}</div>
              <div id="liveCountdownValue" style="font-size:1.6rem;font-weight:800;margin-top:4px;">${formatCountdown(nextEv.ts)}</div>

              <div style="font-weight:800;">🗺️ ${esc(S.roadmaps)}</div>

            <div class="card" style="cursor:pointer;" data-nav="pomodoro">
              <div style="font-weight:800;">⏱️ ${esc(S.pomodoro)}</div>

            <div class="card" style="cursor:pointer;" data-nav="gpa">

            <div class="card" style="cursor:pointer;" data-nav="hub">
              <div style="font-weight:800;">📚 ${esc(S.studyHub)}</div>
              <div class="muted" style="margin-top:4px;">${esc(S.bookAssistant)}</div>
            </div>
          </div>
        </div>

    function renderStudentInbox(S) {
      const list = state.emails.filter((e) => state.emailFilter === 'ALL' || e.priority === state.emailFilter);
      return `
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="between">
            <h2 style="margin:0;font-size:1.15rem;">📥 ${esc(S.inbox)}</h2>
            <div class="row">
              ${['ALL','CRITICAL','HIGH','NORMAL','LOW'].map((p) => `
                <button type="button" class="pill ${state.emailFilter === p ? 'active' : ''}" data-email-filter="${p}">${esc(prioLabel(p, S))}</button>
              `).join('')}
            </div>
          </div>

          <div class="card">
            <div style="font-weight:700;margin-bottom:8px;">✉️ ${esc(S.compose)}</div>
            <div class="grid-2">
              <input id="composeTo" class="input" placeholder="${esc(S.composeToPh)}" />
              <input id="composeSub" class="input" placeholder="${esc(S.composeSubPh)}" />
            </div>
            <textarea id="composeBody" class="textarea" rows="2" style="margin-top:8px;" placeholder="${esc(S.composeBodyPh)}"></textarea>

                </div>
                <span class="muted">${esc(e.sender)}</span>
              </div>
              <p style="margin:8px 0 6px;">${esc(e.body)}</p>

            </div>
          `).join('')}
        </div>
      `;
    }

    function renderInstructorDashboard(S) {
      const criticalCount = state.emails.filter((e) => e.priority === 'CRITICAL' && !e.answered).length;
      const pendingCount = state.emails.filter((e) => !e.answered).length;
      const list = state.emails.filter((e) => {
        const pf = state.emailFilter === 'ALL' || e.priority === state.emailFilter;
        const q = state.emailSearch.trim().toLowerCase();
        const sf = !q || (e.subject + e.sender + e.code + e.body).toLowerCase().includes(q);
        return pf && sf;
      });

      return `
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="grid-2">
            <div class="card" style="background:var(--primary);color:var(--on-primary);">
              <div style="font-size:0.82rem;opacity:0.88;">${esc(S.unansweredInquiries)}</div>
              <div style="font-size:1.65rem;font-weight:800;">${pendingCount}</div>
            </div>
            <div class="card">
              <div class="muted">${esc(S.criticalPriority)}</div>
              <div style="font-size:1.65rem;font-weight:800;color:#9E2A3B;">${criticalCount}</div>
            </div>
          </div>

          <div class="card">
            <div class="between">
              <strong>🔁 ${esc(S.repeatedQ)}</strong>
              <button id="btnGroupQuestions" type="button" class="btn btn-primary btn-sm">${esc(S.groupBtn)}</button>
            </div>
            ${state.clusters.length ? state.clusters.map((cl, idx) => `
              <div class="card" style="margin-top:8px;background:var(--surface-alt);">
                <div style="font-weight:700;">${esc(cl.code)} · ${esc(cl.topic)} (${cl.count})</div>
                <div class="muted" style="margin:4px 0;">${esc(cl.suggested)}</div>
                <button type="button" class="btn btn-primary btn-sm" data-send-unified="${idx}">${esc(S.unifiedReply)}</button>
              </div>
            `).join('') : ''}
          </div>

          <div class="row">
            <input id="instEmailSearch" class="input" style="flex:1;min-width:180px;" placeholder="${esc(S.searchPlaceholder)}" value="${esc(state.emailSearch)}" />
            ${['ALL','CRITICAL','HIGH','NORMAL','LOW'].map((p) => `
              <button type="button" class="pill ${state.emailFilter === p ? 'active' : ''}" data-email-filter="${p}">${esc(prioLabel(p, S))}</button>
            `).join('')}
          </div>

          ${list.map((e) => `
            <div class="card">
              <div class="between">
                <div><span class="prio-badge prio-${e.priority}">${esc(prioLabel(e.priority, S))}</span> <strong>${esc(e.code)} · ${esc(e.subject)}</strong></div>
                <span class="muted">${esc(e.sender)}</span>
              </div>
              <p style="margin:8px 0 0;">${esc(e.body)}</p>

        </div>
      `;

    function renderPomodoro(S) {
      const mm = String(Math.floor(state.pomodoroSecondsLeft / 60)).padStart(2, '0');
      const ss = String(state.pomodoroSecondsLeft % 60).padStart(2, '0');
      const avatarFace = state.pomodoroCompanion === 'girl' ? '👩‍🎓' : '👨‍🎓';
      const milestonePct = Math.min(100, Math.round(((state.focusMinutesLogged % 30) / 30) * 100));
      const milestonesEarned = Math.floor(state.focusMinutesLogged / 30);
      return `
        <div class="card" style="text-align:center;padding:24px 16px;">
          <div class="companion-bob" style="font-size:3.6rem;">${avatarFace}</div>
          <h2 style="margin:6px 0;">${esc(S.focusMode)}</h2>
          <div id="pomoClock" style="font-size:3rem;font-weight:800;letter-spacing:1px;margin:10px 0;">${mm}:${ss}</div>

          <div class="card" style="background:var(--bg);max-width:360px;margin:0 auto 14px;padding:10px 12px;text-align:start;">
            <div class="between" style="font-size:0.82rem;font-weight:700;">
              <span>🏅 ${esc(S.milestoneLabel)}</span>
              <span>${milestonesEarned}× · ${state.focusMinutesLogged} ${esc(S.minStudied)}</span>
            </div>
            <div style="height:8px;border-radius:999px;background:var(--surface-alt);margin-top:6px;overflow:hidden;">
              <div style="height:100%;width:${milestonePct}%;background:var(--primary);border-radius:999px;"></div>
            </div>
          </div>

          ${!state.pomodoroRunning ? `
            <div class="row" style="justify-content:center;margin-bottom:14px;">
              <button type="button" class="pill ${state.pomodoroCompanion === 'girl' ? 'active' : ''}" data-comp="girl">${esc(S.girlComp)}</button>
              <button type="button" class="pill ${state.pomodoroCompanion === 'boy' ? 'active' : ''}" data-comp="boy">${esc(S.boyComp)}</button>
            </div>
            <div class="row" style="justify-content:center;margin-bottom:14px;">
              ${[25, 45, 50].map((m) => `<button type="button" class="pill ${state.pomodoroMinutes === m ? 'active' : ''}" data-pomo-min="${m}">${m}m</button>`).join('')}
            </div>
            <div class="row" style="justify-content:center;">
              <button id="btnPomoStart" type="button" class="btn btn-primary">${esc(S.startFocus)}</button>
              <button id="btnPomoReset" type="button" class="btn btn-outline">${esc(S.reset)}</button>
            </div>
          ` : `
            <div class="card" style="background:var(--surface-alt);margin:10px auto;max-width:360px;">
              🔒 ${esc(S.focusLocked)}

            ${state.focusLockBanner ? `<div class="card" style="background:#9E2A3B;color:#fff;margin:8px auto;max-width:360px;padding:8px 12px;font-size:0.84rem;">⚠️ ${esc(S.focusLockWarn)}</div>` : ''}
          `}
        </div>
      `;
    }

    function renderRoadmapScreen(S) {
      const major = MAJORS.find((m) => m.id === state.majorId) || MAJORS[0];
      const stagesMap = {};
      major.courses.forEach((cr) => {
        (stagesMap[cr.stage] = stagesMap[cr.stage] || []).push(cr);
      });
      const stageKeys = Object.keys(stagesMap).map(Number).sort((a, b) => a - b);

      const nodeW = 184, nodeH = 104, colGap = 76, rowGap = 24, pad = 20, headerBand = 42;
      const layouts = [];
      const byCode = {};
      let maxRows = 1;

      stageKeys.forEach((stNum, colIdx) => {
        const list = stagesMap[stNum];
        if (list.length > maxRows) maxRows = list.length;
        const x = pad + colIdx * (nodeW + colGap);
        list.forEach((course, rowIdx) => {
          const y = pad + headerBand + rowIdx * (nodeH + rowGap);
          const item = { course, stageIdx: colIdx, rowIdx, x, y };
          layouts.push(item);
          byCode[course.code] = item;
        });
      });

      const boardW = pad * 2 + stageKeys.length * nodeW + Math.max(0, stageKeys.length - 1) * colGap;
      const boardH = pad * 2 + headerBand + maxRows * nodeH + Math.max(0, maxRows - 1) * rowGap;
      const categories = [...new Set(major.courses.map((cr) => cr.category))];

      const completedCredits = major.courses
        .filter((cr) => (state.courseStatuses[`${major.id}:${cr.code}`] || 'NOT_STARTED') === 'COMPLETED')
        .reduce((acc, cr) => acc + cr.credits, 0);

      // Build clean SVG cubic curves for prerequisites
      const paths = [];
      layouts.forEach((target) => {
        target.course.prereq.forEach((pCode, idx) => {
          const src = byCode[pCode];
          if (!src) return;
          const x1 = src.x + nodeW;
          const y1 = src.y + nodeH * 0.5;
          const x2 = target.x - 4;
          const y2 = target.y + nodeH * 0.5 + ((idx % 3) - 1) * 8;
          const cx = src.stageIdx < target.stageIdx ? x1 + (x2 - x1) * 0.48 : x1 + 28;
          paths.push(`<path d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}" fill="none" stroke="var(--primary)" stroke-opacity="0.48" stroke-width="2" marker-end="url(#arrowHead)" />`);
        });
      });

      const zoomScale = zoomPercentToScale(state.roadmapZoom, boardW);

      return `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div class="between">
            <div>
              <h2 style="margin:0;font-size:1.12rem;">🗺️ ${esc(S.roadmapTitle)}</h2>
              <div id="zoomPercentText" class="muted" style="font-weight:700;color:var(--primary);">${esc(S.zoom)}: ${Math.round(state.roadmapZoom)}%</div>
            </div>
            <div class="row" style="gap:6px;">
              <button id="zoomZeroBtn" type="button" class="btn btn-outline btn-sm">0%</button>
              <button id="zoomOutBtn" type="button" class="btn btn-outline btn-sm">−</button>
              <button id="zoomInBtn" type="button" class="btn btn-outline btn-sm">+</button>
              <button id="zoomResetBtn" type="button" class="btn btn-outline btn-sm">↺</button>
            </div>
          </div>

          <input id="zoomSlider" type="range" min="0" max="200" value="${Math.round(state.roadmapZoom)}" style="width:100%;" />

          <div class="row" style="overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;">
            ${MAJORS.map((m) => `<button type="button" class="pill ${m.id === major.id ? 'active' : ''}" style="white-space:nowrap;" data-major-chip="${m.id}">${esc(m.name)}</button>`).join('')}
          </div>

          <div class="card" style="padding:10px 12px;">
            <div class="between" style="font-size:0.84rem;font-weight:700;">
              <span>${esc(S.statusCompleted)}: ${completedCredits}/${major.totalCredits} ${esc(S.credits)}</span>
              <span>${Math.round((completedCredits / major.totalCredits) * 100)}%</span>
            </div>
            <div class="row" style="margin-top:8px;gap:6px;">
              ${categories.map((cat) => `
                <span class="pill" style="padding:3px 10px;font-size:0.76rem;border-color:${catColor(cat)};color:${catColor(cat)};">
                  <span style="width:8px;height:8px;border-radius:50%;background:${catColor(cat)};display:inline-block;"></span>
                  ${esc(catLabel(cat, S))}
                </span>
              `).join('')}
            </div>
          </div>

          <div id="roadmapViewport" class="roadmap-viewport">
            <div id="roadmapBoard" class="roadmap-board" style="width:${boardW}px;height:${boardH}px;transform:translate(${state.roadmapPanX}px, ${state.roadmapPanY}px) scale(${zoomScale});">
              <svg width="${boardW}" height="${boardH}" style="position:absolute;inset:0;pointer-events:none;">
                <defs>
                  <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L6,3 z" fill="var(--primary)" fill-opacity="0.7" />
                  </marker>
                </defs>
                ${paths.join('')}
              </svg>

              ${stageKeys.map((stNum, idx) => `
                <div class="roadmap-stage-pill" style="left:${pad + idx * (nodeW + colGap)}px;top:${pad}px;">${esc(S.stage)} ${stNum}</div>
              `).join('')}

              ${layouts.map(({ course, x, y }) => {
                const st = state.courseStatuses[`${major.id}:${course.code}`] || 'NOT_STARTED';
                const cCol = catColor(course.category);
                const sCol = statusColor(st);
                return `
                  <button type="button" class="roadmap-node" data-course-node="${course.code}"
                    style="left:${x}px;top:${y}px;border-color:${st !== 'NOT_STARTED' ? sCol : cCol};">
                    <div class="roadmap-node-head" style="background:${cCol};">
                      <span>${esc(course.code)}</span>
                      <span>${course.credits}${esc(S.credits)} ▾</span>
                    </div>
                    <div class="roadmap-node-body">
                      <div class="roadmap-node-title">${esc(course.title)}</div>
                      <div class="between" style="font-size:10.5px;color:var(--text-sec);">
                        <span>🔓 ${course.prereq.length ? esc(course.prereq.join(',')) : '—'}</span>
                        <span style="font-weight:700;color:${sCol};">${st !== 'NOT_STARTED' ? esc(statusLabel(st, S)) : ''}</span>
                      </div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function zoomPercentToScale(pct, boardW) {
      const vpW = Math.max(300, Math.min(1040, window.innerWidth - 36));
      const fit = Math.max(0.24, Math.min(0.78, (vpW - 16) / boardW));
      const p = Math.max(0, Math.min(200, pct));
      return p <= 100 ? fit + (p / 100) * (1 - fit) : 1 + ((p - 100) / 100) * 0.8;
    }

    function bindRoadmapEvents() {
      const vp = document.getElementById('roadmapViewport');
      const board = document.getElementById('roadmapBoard');
      if (!vp || !board) return;

      const boardW = parseFloat(board.style.width) || 1200;
      const updateTransform = () => {
        const scale = zoomPercentToScale(state.roadmapZoom, boardW);
        board.style.transform = `translate(${state.roadmapPanX}px, ${state.roadmapPanY}px) scale(${scale})`;
        const lbl = document.getElementById('zoomPercentText');
        const S = t(state.language);
        if (lbl) lbl.textContent = `${S.zoom}: ${Math.round(state.roadmapZoom)}%`;
        const slider = document.getElementById('zoomSlider');
        if (slider) slider.value = String(Math.round(state.roadmapZoom));
      };

      document.getElementById('zoomZeroBtn')?.addEventListener('click', () => {
        state.roadmapZoom = 0; state.roadmapPanX = 0; state.roadmapPanY = 0;
        saveState(); updateTransform();
      });
      document.getElementById('zoomOutBtn')?.addEventListener('click', () => {
        state.roadmapZoom = Math.max(0, state.roadmapZoom - 15);
        saveState(); updateTransform();
      });
      document.getElementById('zoomInBtn')?.addEventListener('click', () => {
        state.roadmapZoom = Math.min(200, state.roadmapZoom + 15);
        saveState(); updateTransform();
      });
      document.getElementById('zoomResetBtn')?.addEventListener('click', () => {
        state.roadmapZoom = window.innerWidth < 600 ? 70 : 100;
        state.roadmapPanX = 0; state.roadmapPanY = 0;
        saveState(); updateTransform();
      });
      document.getElementById('zoomSlider')?.addEventListener('input', (e) => {
        state.roadmapZoom = Math.max(0, Math.min(200, Number(e.target.value)));
        saveState(); updateTransform();
      });

      let dragging = false, moved = false, startX = 0, startY = 0, basePanX = 0, basePanY = 0, pinchDist = 0, pinchZoomBase = state.roadmapZoom;
      vp.addEventListener('pointerdown', (e) => {
        if (e.target.closest('[data-course-node]')) return;
        dragging = true; moved = false;
        startX = e.clientX; startY = e.clientY;
        basePanX = state.roadmapPanX; basePanY = state.roadmapPanY;
        try { vp.setPointerCapture(e.pointerId); } catch (_) {}
      });
      vp.addEventListener('pointermove', (e) => {
        if (!dragging || pinchDist > 0) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        state.roadmapPanX = basePanX + dx;
        state.roadmapPanY = basePanY + dy;
        updateTransform();
      });
      vp.addEventListener('pointerup', () => { dragging = false; saveState(); });
      vp.addEventListener('pointercancel', () => { dragging = false; });
      vp.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length === 2) {
          dragging = false;
          pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          pinchZoomBase = state.roadmapZoom;
        }
      }, { passive: true });
      vp.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length === 2 && pinchDist > 0) {
          e.preventDefault();
          const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          state.roadmapZoom = Math.max(0, Math.min(200, pinchZoomBase + (dist - pinchDist) * 0.35));
          updateTransform();
        }
      }, { passive: false });
      vp.addEventListener('touchend', () => {
        if (pinchDist > 0) { pinchDist = 0; saveState(); }
      });
      vp.addEventListener('wheel', (e) => {
        e.preventDefault();
        state.roadmapZoom = Math.max(0, Math.min(200, state.roadmapZoom - Math.sign(e.deltaY) * 10));
        saveState(); updateTransform();
      }, { passive: false });

      document.querySelectorAll('[data-major-chip]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.majorId = btn.getAttribute('data-major-chip');
          state.roadmapPanX = 0; state.roadmapPanY = 0;
          saveState(); render();
        });
      });
      document.querySelectorAll('[data-course-node]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (moved) return;
          state.roadmapInspectCode = btn.getAttribute('data-course-node');
          render();
        });
      });
      document.getElementById('closeCourseModalBtn')?.addEventListener('click', () => {
        state.roadmapInspectCode = null; render();
      });
      document.getElementById('courseModalBackdrop')?.addEventListener('click', (e) => {
        if (e.target.id === 'courseModalBackdrop') { state.roadmapInspectCode = null; render(); }
      });
      document.querySelectorAll('[data-set-course-status]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const st = btn.getAttribute('data-set-course-status');
          state.courseStatuses[`${state.majorId}:${state.roadmapInspectCode}`] = st;
          saveState(); render();

      document.querySelectorAll('[data-jump-course]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.roadmapInspectCode = btn.getAttribute('data-jump-course');
          render();
        });
      });
    }

      if (document.hidden && state.loggedIn && state.pomodoroRunning) {

    });

    // 1-second ticker for Pomodoro & Live Countdown / Due Smart Alarms
    setInterval(() => {
      if (state.loggedIn && state.pomodoroRunning) {
        if (state.pomodoroSecondsLeft > 0) {
          state.pomodoroSecondsLeft -= 1;
          const clockEl = document.getElementById('pomoClock');
          if (clockEl) {
            const mm = String(Math.floor(state.pomodoroSecondsLeft / 60)).padStart(2, '0');
            const ss = String(state.pomodoroSecondsLeft % 60).padStart(2, '0');
            clockEl.textContent = `${mm}:${ss}`;
          }
        } else {
          state.pomodoroRunning = false;
          state.focusLockBanner = false;
          state.focusMinutesLogged += state.pomodoroMinutes;
          state.pomodoroSecondsLeft = state.pomodoroMinutes * 60;
          playRingtone('chime');
          saveState();
          render();
        }
      }
      if (state.loggedIn && !state.activeAlarm && state.events.length) {
        const now = Date.now();
        const due = state.events.find((ev) => !ev.triggered && ev.ts <= now);
        if (due) {
          due.triggered = true;
          state.activeAlarm = due;
          startAlarmLoop(due.ringtone);
          saveState();
          render();
        }
      }
      const cdEl = document.getElementById('liveCountdownValue');
      if (cdEl && state.events.length) {
        const nextEv = [...state.events].sort((a, b) => a.ts - b.ts)[0];
        cdEl.textContent = formatCountdown(nextEv.ts);
      }
    }, 1000);

    if (window.location.hash.includes('access_token=') || window.location.search.includes('code=')) {
      state.loggedIn = true;
      state.authProvider = 'microsoft';
      saveState();
      try { window.history.replaceState({}, document.title, window.location.pathname); } catch (_) {}
    }

    if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', render);
    } else {
      render();
    }
  })();
  </script>
</body>
</html>
